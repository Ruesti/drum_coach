name: drum_coach
description: "E-drum trainer: measures every hit via MIDI and decides gates from the numbers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_soloud: ^3.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  flutter_midi_command: 1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_midi_command_platform_interface: 1.4.0
  flutter_midi_command_linux:
    path: packages/flutter_midi_command_linux

dependency_overrides:
  flutter_midi_command_linux:
    path: packages/flutter_midi_command_linux

flutter:
  uses-material-design: true
